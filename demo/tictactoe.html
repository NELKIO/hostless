<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tic-tac-toe · hostless</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <header>
      <h1><a href="./">hostless</a> · tic-tac-toe</h1>
      <hostless-link id="link"></hostless-link>
    </header>
    <section class="card" id="lobby-card">
      <p class="muted">A turn-based match (TurnMatch): moves are signed, saved before they are sent, and survive reloads. Close this tab mid-game and reopen the link.</p>
      <hostless-lobby id="lobby"></hostless-lobby>
    </section>
    <section class="card" id="game" hidden>
      <div class="row" style="justify-content: space-between">
        <strong id="players"></strong>
        <span class="muted" id="seats"></span>
      </div>
      <div class="board" id="board"></div>
      <div class="status" id="status" aria-live="polite"></div>
      <div class="row" style="justify-content: center; margin-top: 12px">
        <button id="leave">Leave</button>
        <button id="again" class="primary" hidden>New game</button>
      </div>
    </section>
  </main>
  <script type="module" src="tictactoe.js"></script>
</body>
</html>
