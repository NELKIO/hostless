<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Synced clicker · hostless</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <header>
      <h1><a href="./">hostless</a> · synced clicker</h1>
    </header>
    <section class="card">
      <p class="muted">Your progress lives in this browser and follows you to your other devices through encrypted Nostr events (DeviceSync, a CRDT ledger: offline clicks on two devices add up, never double).</p>
      <div class="big" id="count">0</div>
      <div class="row" style="justify-content: center">
        <button class="primary" id="click">Click</button>
      </div>
    </section>
    <section class="card">
      <h2>Devices</h2>
      <hostless-sync id="sync"></hostless-sync>
    </section>
    <section class="card">
      <h2>Everyone</h2>
      <p id="world" class="muted">Loading the totals of every browser…</p>
      <button id="refresh">Refresh</button>
    </section>
  </main>
  <script type="module" src="clicker.js"></script>
</body>
</html>
