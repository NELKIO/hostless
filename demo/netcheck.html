<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connection check · hostless</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <div class="head">
      <h1>Connection check</h1>
      <p>Shows which public relays and brokers this network reaches, with a test message through each, and whether a direct WebRTC channel is likely. If someone can't connect, ask them to run this and send you the result.</p>
      <div class="tags"><span class="tag">checkNetwork()</span><span class="tag">STUN NAT type</span></div>
    </div>
    <section class="card">
      <hostless-netcheck id="check"></hostless-netcheck>
    </section>
  </main>
  <script type="module" src="netcheck.js"></script>
</body>
</html>
